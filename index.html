<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10213f">
<title>COC Builder • Kamera Audit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:16px Arial,sans-serif}
header{background:#10213f;color:white;padding:16px;font-weight:700}
main{max-width:620px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #d9e1ec;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #14233b0b}
h1{font-size:20px;margin:0 0 6px}p{font-size:13px;line-height:1.45;color:#536176}
#meta{margin:8px 0 12px;color:#475569;font-size:13px}
#status{padding:10px 12px;border-radius:9px;background:#edf3ff;color:#254b9b}
video,img{width:100%;max-height:62vh;aspect-ratio:4/3;object-fit:contain;background:#101827;border-radius:12px;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:10px;padding:13px 15px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#2457df;color:white;flex:1}.secondary{background:#e8edf5;color:#172033}
button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}
input{display:none}.filebtn{display:block;text-align:center;background:#e8edf5;color:#172033;border-radius:10px;padding:13px;font-weight:700}
</style>
</head>
<body>
<header>📷 COC Builder — Kamera Audit Toko</header>
<main>
<section class="card">
<h1>Foto audit</h1>
<div id="meta">Membuka kamera…</div>
<div id="status" role="status">Meminta izin kamera HP. Jika diminta, pilih Izinkan.</div>
</section>
<section class="card">
<video id="video" autoplay playsinline muted></video>
<img id="preview" class="hidden" alt="Pratinjau foto audit">
<canvas id="canvas" class="hidden"></canvas>
<div class="row" id="cameraActions">
<button class="primary" id="start">Buka kamera</button>
<button class="secondary" id="switch" disabled>Ganti kamera</button>
</div>
<div class="row hidden" id="reviewActions">
<button class="secondary" id="retake">Ambil ulang</button>
<button class="primary" id="send">Gunakan foto ini</button>
</div>
<div class="row"><label class="filebtn" for="file">Pilih foto dari galeri</label><input id="file" type="file" accept="image/*" capture="environment"></div>
<p>Foto akan dikirim kembali ke tab COC Builder yang membuka halaman ini. Foto tidak diunggah ke repository GitHub.</p>
</section>
</main>
<script>
(() => {
"use strict";
const q=new URLSearchParams(location.search), token=q.get("token")||"", target=q.get("target")||"";
const title=q.get("title")||"Foto audit", store=q.get("store")||"", bay=q.get("bay")||"", step=q.get("step")||"before";
const $=id=>document.getElementById(id), video=$("video"), preview=$("preview"), canvas=$("canvas");
const statusEl=$("status"), cameraActions=$("cameraActions"), reviewActions=$("reviewActions");
let stream=null, photo="", devices=[], activeId="";
$("meta").textContent=title+(store?" • Toko "+store:"")+" • "+step.toUpperCase();
function status(m,bad=false){statusEl.textContent=m;statusEl.style.background=bad?"#fff0f0":"#edf3ff";statusEl.style.color=bad?"#9b2525":"#254b9b"}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}
async function listDevices(){try{devices=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==="videoinput");const t=stream&&stream.getVideoTracks()[0];activeId=t?t.getSettings().deviceId||"":activeId;$("switch").disabled=devices.length<2}catch{}}
async function start(deviceId=""){
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){status("Kamera membutuhkan HTTPS dan browser yang mendukung akses kamera.",true);return}
 stop();
 try{
  const v=deviceId?{deviceId:{exact:deviceId}}:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}};
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:v});video.srcObject=stream;video.classList.remove("hidden");preview.classList.add("hidden");await video.play();await listDevices();
  cameraActions.classList.remove("hidden");reviewActions.classList.add("hidden");$("start").textContent="Ambil foto";status("Kamera aktif. Arahkan kamera ke rak, lalu tekan Ambil foto.");
 }catch(e){status("Kamera belum bisa dibuka: "+(e.name||"")+" — "+(e.message||"Periksa izin kamera.")+". Tekan Buka kamera untuk mencoba lagi atau pilih foto dari galeri.",true);$("start").textContent="Coba buka kamera"}
}
function showPhoto(data){photo=data;stop();preview.src=photo;preview.classList.remove("hidden");video.classList.add("hidden");cameraActions.classList.add("hidden");reviewActions.classList.remove("hidden");status("Foto siap. Tekan Gunakan foto ini untuk mengirim ke COC Builder.")}
function capture(){if(!stream||!video.videoWidth)return;const s=Math.min(1,1600/video.videoWidth);canvas.width=Math.round(video.videoWidth*s);canvas.height=Math.round(video.videoHeight*s);canvas.getContext("2d",{alpha:false}).drawImage(video,0,0,canvas.width,canvas.height);showPhoto(canvas.toDataURL("image/jpeg",.84))}
$("start").onclick=()=>stream?capture():start();
$("switch").onclick=async()=>{if(devices.length<2)return;const i=devices.findIndex(d=>d.deviceId===activeId);await start(devices[(i+1)%devices.length].deviceId)};
$("retake").onclick=()=>{photo="";start()};
$("file").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>showPhoto(r.result);r.readAsDataURL(f)};
$("send").onclick=()=>{
 if(!photo)return;
 if(token&&target&&window.opener&&!window.opener.closed){
  window.opener.postMessage({type:"COC_AUDIT_CAMERA_RESULT",token,image:photo,store,bay,step,capturedAt:new Date().toISOString()},target);
  status("Foto dikirim ke COC Builder. Kembali ke tab aplikasi untuk crop dan simpan.");$("send").disabled=true;setTimeout(()=>window.close(),900);
 }else{
  const a=document.createElement("a");a.href=photo;a.download="COC-Audit-"+step+"-"+Date.now()+".jpg";a.click();
  status("Halaman dibuka langsung tanpa sesi COC Builder. Foto diunduh ke HP. Untuk menyimpan otomatis ke audit, buka kamera dari tombol Kamera HP pada bay COC Builder.");
 }
};
window.addEventListener("pagehide",stop);
window.addEventListener("load",()=>setTimeout(()=>start(),250));
})();
</script>
</body></html>
